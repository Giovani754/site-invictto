<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Painel ADM | INVICTTO MOTORS</title>
  <link rel="icon" href="../brasao.png.png" type="image/png">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'gold': '#B8973E',
            'goldLight': '#D8B46C',
            'goldDark': '#9E7E36',
          },
          fontFamily: {
            'serif': ['Cinzel', 'serif'],
            'sans': ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  
  <!-- Supabase JS SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
</head>
<body class="bg-[#080808] text-gray-100 font-sans min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Ambient Glow -->
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-[#B8973E]/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="w-full max-w-md relative z-10">
    
    <!-- Header Logo -->
    <div class="text-center mb-8">
      <a href="../index.html" class="inline-flex items-center gap-3 mb-4 transition-transform hover:scale-105 duration-300">
        <img src="../brasao.png.png" alt="Brasão Invictto" class="h-12 w-auto object-contain">
        <img src="../texto-logo.png.png" alt="Invictto Motors" class="h-7 w-auto object-contain mt-1">
      </a>
      <p class="text-xs text-[#B8973E] font-semibold tracking-[0.25em] uppercase">Gestão Executiva &amp; Estoque</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white/5 backdrop-blur-md border border-white/10 shadow-2xl rounded-2xl p-8 sm:p-10">
      
      <h1 class="font-serif text-2xl font-bold text-white mb-2 text-center">Acessar Painel</h1>
      <p class="text-gray-400 text-xs text-center mb-6 leading-relaxed">Informe suas credenciais de administrador para continuar.</p>

      <!-- Alert Box -->
      <div id="alertBox" class="hidden mb-5 p-3.5 rounded-xl text-xs font-medium border transition-all"></div>

      <!-- Form -->
      <form id="loginForm" class="space-y-5" onsubmit="handleLogin(event)">
        
        <!-- Email -->
        <div>
          <label for="email" class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">E-mail Corporativo</label>
          <div class="relative">
            <input type="email" id="email" required placeholder="admin@invicttomotors.com.br"
                   class="w-full px-4 py-3.5 bg-black/50 border border-white/15 rounded-xl text-sm text-white placeholder-gray-500 focus:outline-none focus:border-[#B8973E] focus:ring-1 focus:ring-[#B8973E] transition-all">
          </div>
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">Senha de Acesso</label>
          <div class="relative">
            <input type="password" id="password" required placeholder="••••••••••••"
                   class="w-full px-4 py-3.5 bg-black/50 border border-white/15 rounded-xl text-sm text-white placeholder-gray-500 focus:outline-none focus:border-[#B8973E] focus:ring-1 focus:ring-[#B8973E] transition-all">
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btnSubmit"
                class="w-full py-4 bg-[#B8973E] hover:bg-[#d8b46c] text-black font-bold uppercase text-xs tracking-widest rounded-xl transition-all duration-300 shadow-lg shadow-[#B8973E]/20 flex items-center justify-center gap-2 cursor-pointer mt-2">
          <span>Acessar Painel</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/></svg>
        </button>

      </form>
    </div>

    <!-- Back to public site -->
    <div class="text-center mt-6">
      <a href="../index.html" class="text-xs text-gray-400 hover:text-[#B8973E] transition-colors inline-flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
        Voltar para o site público
      </a>
    </div>

  </div>

  <script>
    // Check if already authenticated
    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof redirectIfAuthenticated === 'function') {
        await redirectIfAuthenticated();
      }
    });

    async function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btnSubmit');
      const alertBox = document.getElementById('alertBox');

      alertBox.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = `<svg class="w-4 h-4 animate-spin text-black" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg> Validando...`;

      try {
        if (!supabaseClient) {
          throw new Error("Cliente Supabase não inicializado.");
        }

        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          throw error;
        }

        showAlert('Autenticado com sucesso! Redirecionando...', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 600);

      } catch (err) {
        console.error("Erro no login:", err);
        let msg = err.message || "Email ou senha inválidos.";
        if (msg.includes("Invalid login credentials")) {
          msg = "E-mail ou senha incorretos. Por favor, verifique suas credenciais.";
        }
        showAlert(msg, 'error');
        btn.disabled = false;
        btn.innerHTML = `<span>Acessar Painel</span><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/></svg>`;
      }
    }

    function showAlert(message, type) {
      const alertBox = document.getElementById('alertBox');
      alertBox.textContent = message;
      alertBox.classList.remove('hidden', 'bg-red-500/10', 'border-red-500/30', 'text-red-300', 'bg-green-500/10', 'border-green-500/30', 'text-green-300');
      if (type === 'error') {
        alertBox.classList.add('bg-red-500/10', 'border-red-500/30', 'text-red-300');
      } else {
        alertBox.classList.add('bg-green-500/10', 'border-green-500/30', 'text-green-300');
      }
    }
  </script>
</body>
</html>
